services:
  api:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://datahub:datahub@db:5432/datahub
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: datahub
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub
    ports: ["5432:5432"]
